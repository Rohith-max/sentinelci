[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelci"
version = "0.1.0"
description = "Security scanning CLI tool with AI-powered threat analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SentinelCI Team"}
]
keywords = ["security", "cli", "scanner", "secrets", "cve", "ai"]

dependencies = [
    "click==8.1.7",
    "rich==13.7.0",
    "anthropic==0.50.0",
    "requests==2.31.0",
    "platformdirs==4.0.0",
    "tomli-w==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
]

[project.scripts]
sentinelci = "sentinelci.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinelci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
